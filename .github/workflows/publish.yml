name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  build-typescript:
    name: Build TypeScript packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @cascadeflow/ml
        run: |
          cd packages/ml
          pnpm build

      - name: Build @cascadeflow/core
        run: |
          cd packages/core
          pnpm build

      - name: Build @cascadeflow/n8n-nodes-cascadeflow
        run: |
          cd packages/integrations/n8n
          pnpm build

      - name: Build @cascadeflow/langchain-cascadeflow
        run: |
          cd packages/langchain-cascadeflow
          pnpm build

      - name: Build @cascadeflow/vercel-ai
        run: |
          cd packages/integrations/vercel-ai
          pnpm build

      - name: Build @cascadeflow/paygentic
        run: |
          cd packages/integrations/paygentic
          pnpm build

      # Pack inside the installed workspace so pnpm rewrites workspace: refs
      # to real versions. Packing outside it ships "workspace:*" to npm.
      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/npm-tarballs"
          # Order matters: dependencies are published before dependents.
          PACKAGES=(
            packages/ml
            packages/core
            packages/integrations/n8n
            packages/langchain-cascadeflow
            packages/integrations/vercel-ai
            packages/integrations/paygentic
          )
          i=0
          for dir in "${PACKAGES[@]}"; do
            i=$((i + 1))
            TARBALL=$(cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs" | tail -n 1)
            mv "$TARBALL" "$GITHUB_WORKSPACE/npm-tarballs/$(printf '%02d' "$i")-$(basename "$TARBALL")"
          done
          ls -1 npm-tarballs

      - name: Verify tarballs have no workspace protocol refs
        run: |
          set -euo pipefail
          status=0
          for tarball in npm-tarballs/*.tgz; do
            if tar -xOzf "$tarball" package/package.json | grep -n '"workspace:'; then
              echo "::error::$tarball still contains workspace: protocol references"
              status=1
            fi
          done
          exit $status

      - name: Store npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cascadeflow
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-to-npm:
    name: Publish to npm
    needs: build-typescript
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@cascadeflow/core
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-tarballs/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Update npm for OIDC trusted publishing support
      - name: Update npm to latest
        run: npm install -g npm@latest

      # Tarballs are prefixed with their publish order (dependencies first).
      - name: Publish packages
        run: |
          set -euo pipefail
          for tarball in $(ls npm-tarballs/*.tgz | sort); do
            MANIFEST=$(tar -xOzf "$tarball" package/package.json)
            PACKAGE_NAME=$(node -p "JSON.parse(process.argv[1]).name" "$MANIFEST")
            PACKAGE_VERSION=$(node -p "JSON.parse(process.argv[1]).version" "$MANIFEST")
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm, skipping."
              continue
            fi
            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            npm publish "$tarball" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build-python
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # Only on manual trigger
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cascadeflow
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
